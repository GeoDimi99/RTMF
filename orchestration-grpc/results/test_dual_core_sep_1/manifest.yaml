version: "1.0"

images:
  base: "jeffadac/realtime-microservices:task-wrapper"
  repo: "jeffadac/realtime-microservices"
  tasks:
    - alias: "stress_task_1"
      src: "stress_task_1"
    - alias: "stress_task_2"
      src: "stress_task_2"
    - alias: "stress_task_3"
      src: "stress_task_3"
    - alias: "stress_task_4"
      src: "stress_task_4"
    - alias: "stress_task_5"
      src: "stress_task_5"
    - alias: "stress_task_6"
      src: "stress_task_6"
   
schedule:
  name: "Configurable CPU/IO Benchmark"
  description: "Benchmark with configurable CPU/IO ratio using total_ops and io_percentage parameters"
  iterations: 100
  
  tasks:
    # Pure CPU workload
    - id: 1
      image: "stress_task_1"
      start: 50
      deadline: 650
      cpu_affinity: 5
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 17
        io_percentage:
          type: int
          value: 0      
      outputs:
        result:
          type: int

    - id: 2
      image: "stress_task_2"
      start: 300
      deadline: 1300
      cpu_affinity: 5
      policy: "fifo"
      priority: 50
