        total_ops:
          type: int
          value: 17
        io_percentage:
          type: int
          value: 0      
      outputs:
        result:
          type: int


    - id: 3
      image: "stress_task_3"
      start: 350
      deadline: 950
      cpu_affinity: 5
      policy: "fifo"
      priority: 70
      depends_on: []
